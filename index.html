<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Proposal Click Only 😈</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 500px;
    }

    #loveGif {
      display: none;
      width: 220px;
      max-width: 80vw;
      border-radius: 20px;
    }

    h1 {
      color: white;
      margin: 0;
      font-size: 28px;
      line-height: 1.3;
      padding: 0 10px;
    }

    .buttons {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #yes {
      background: #28c76f;
      color: white;
      z-index: 3;
    }

    #no {
      background: #ea5455;
      color: white;
    }

    .yes-mode .buttons {
      flex-direction: column;
      gap: 16px;
    }

    .yes-mode #loveGif {
      display: block;
    }

    .yes-mode #no {
      display: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }

      .btn {
        font-size: 18px;
        padding: 13px 24px;
      }

      #loveGif {
        width: 180px;
      }
    }
  </style>
</head>
<body>

  <div class="container" id="container">
    <img
      id="loveGif"
      src="Love.gif"
      alt="Love GIF"
    >

    <h1 id="text">T9ebli tzewji biya? 💍🥺</h1>

    <div class="buttons">
      <button class="btn" id="yes">AH 😍</button>
      <button class="btn" id="no">LA 😏</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    const container = document.getElementById("container");
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const text = document.getElementById("text");
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    let noScale = 1;
    let yesScale = 1;
    let animationRunning = false;

    let messages = [
      "Wesh met2akda? 😏",
      "Wesh bsa7? 😳",
      "Fakri 3awdi 😂",
      "Zidi fakri 😭",
      "Rah ghalta 😭💔"
    ];
    let index = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    noBtn.onclick = () => {
      noScale -= 0.15;
      yesScale += 0.18;

      if (noScale <= 0) {
        noBtn.style.display = "none";
      } else {
        noBtn.style.transform = "scale(" + noScale + ")";
      }

      yesBtn.style.transform = "scale(" + yesScale + ")";
      text.innerText = messages[index % messages.length];
      index++;
    };

    yesBtn.onclick = () => {
      text.innerText = "🥳 Mabrouuuuk!! 🥳";
      yesScale += 0.2;
      yesBtn.style.transform = "scale(" + yesScale + ")";

      container.classList.add("yes-mode");
      startCelebration();
    };

    function drawHeart(x, y, size, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x, y - size / 2, x - size, y - size / 2, x - size, y);
      ctx.bezierCurveTo(x - size, y + size / 2, x, y + size, x, y + size * 1.2);
      ctx.bezierCurveTo(x, y + size, x + size, y + size / 2, x + size, y);
      ctx.bezierCurveTo(x + size, y - size / 2, x, y - size / 2, x, y);
      ctx.fillStyle = "#ff2d55";
      ctx.fill();
      ctx.restore();
    }

    function startCelebration() {
      if (animationRunning) return;
      animationRunning = true;

      let confettiPieces = [];
      let hearts = [];

      for (let i = 0; i < 180; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          speedY: Math.random() * 3 + 2,
          speedX: (Math.random() - 0.5) * 2,
          color: "hsl(" + Math.random() * 360 + ", 100%, 50%)"
        });
      }

      for (let i = 0; i < 50; i++) {
        hearts.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          size: Math.random() * 12 + 8,
          speedX: (Math.random() - 0.5) * 8,
          speedY: -(Math.random() * 4 + 2),
          alpha: 1
        });
      }

      let frames = 0;
      const maxFrames = 300;

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        confettiPieces.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
          p.x += p.speedX;
          p.y += p.speedY;

          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });

        hearts.forEach(h => {
          drawHeart(h.x, h.y, h.size, h.alpha);
          h.x += h.speedX;
          h.y += h.speedY;
          h.alpha -= 0.015;
        });

        hearts = hearts.filter(h => h.alpha > 0);

        frames++;
        if (frames < maxFrames) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          animationRunning = false;
        }
      }

      animate();
    }
  </script>

</body>
</html>
