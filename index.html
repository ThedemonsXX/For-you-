<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Proposal Click Only 😈</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      color: white;
      margin-bottom: 40px;
      padding: 0 20px;
      transition: transform 0.3s ease;
    }

    .buttons {
      display: flex;
      gap: 40px;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    #yes {
      background: #28c76f;
      color: white;
      z-index: 2;
    }

    #no {
      background: #ea5455;
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
<img id="loveGif"
     src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUycmtrbWg1enUweXJkNGY5NWs3enFnMDA2Z3U5dWF1ZXptbWt0ZXVqaSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ytu2GUYbvhz7zShGwS/giphy.gif"
     style="display:none; width:220px; margin-bottom:20px; border-radius:20px;">

  <h1 id="text">T9ebli tzewji biya? 💍🥺</h1>

  <div class="buttons">
    <button class="btn" id="yes">AH 😍</button>
    <button class="btn" id="no">LA 😏</button>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    const gif = document.getElementById("loveGif");
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const text = document.getElementById("text");
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    let scale = 1;
    let animationRunning = false;

    let messages = [
      "Wesh met2akda? 😏",
      "Wesh bsa7? 😳",
      "Fakri 3awdi 😂",
      "Zidi fakri 😭",
      "Rah ghalta 😭💔"
    ];
    let index = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    noBtn.onclick = () => {
  scale += 0.3;
  noBtn.style.transform = "scale(" + scale + ")";

  text.style.transform = "translateY(-" + (scale * 10) + "px)";
  text.innerText = messages[index % messages.length];
  index++;

  gif.style.opacity = "0";
  gif.style.transform = "scale(0.8)";
  setTimeout(() => {
    gif.style.display = "none";
  }, 500);
};

    yesBtn.onclick = () => {
  text.innerText = "🥳 Mabrouuuuk!! 🥳";
  text.style.transform = "translateY(0)";

  scale = 1;
  noBtn.style.transform = "scale(1)";

  // 👇 show GIF
  gif.style.display = "block";

  startCelebration();
};

    function drawHeart(x, y, size, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x, y - size / 2, x - size, y - size / 2, x - size, y);
      ctx.bezierCurveTo(x - size, y + size / 2, x, y + size, x, y + size * 1.2);
      ctx.bezierCurveTo(x, y + size, x + size, y + size / 2, x + size, y);
      ctx.bezierCurveTo(x + size, y - size / 2, x, y - size / 2, x, y);
      ctx.fillStyle = "#ff2d55";
      ctx.fill();
      ctx.restore();
    }

    function startCelebration() {
      if (animationRunning) return;
      animationRunning = true;

      let confettiPieces = [];
      let hearts = [];

      for (let i = 0; i < 180; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          speedY: Math.random() * 3 + 2,
          speedX: (Math.random() - 0.5) * 2,
          color: "hsl(" + Math.random() * 360 + ", 100%, 50%)"
        });
      }

      for (let i = 0; i < 50; i++) {
        hearts.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          size: Math.random() * 12 + 8,
          speedX: (Math.random() - 0.5) * 8,
          speedY: -(Math.random() * 4 + 2),
          alpha: 1
        });
      }

      let frames = 0;
      const maxFrames = 300;

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        confettiPieces.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
          p.x += p.speedX;
          p.y += p.speedY;

          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });

        hearts.forEach(h => {
          drawHeart(h.x, h.y, h.size, h.alpha);
          h.x += h.speedX;
          h.y += h.speedY;
          h.alpha -= 0.015;
        });

        hearts = hearts.filter(h => h.alpha > 0);

        frames++;
        if (frames < maxFrames) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          animationRunning = false;
        }
      }

      animate();
    }
  </script>

</body>
</html>
