<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Proposal Click Only 😈</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
    }

    /* TEXT ALWAYS ON TOP */
    h1 {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      z-index: 3;
      text-align: center;
    }

    #loveGif {
      display: none;
      width: 220px;
      border-radius: 20px;
      margin-bottom: 10px;
      z-index: 3;
    }

    .buttons {
      display: flex;
      gap: 40px;
      z-index: 2;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #yes {
      background: #28c76f;
      color: white;
      z-index: 3;
    }

    #no {
      background: #ea5455;
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <img id="loveGif"
       src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUycmtrbWg1enUweXJkNGY5NWs3enFnMDA2Z3U5dWF1ZXptbWt0ZXVqaSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ytu2GUYbvhz7zShGwS/giphy.gif">

  <h1 id="text">T9ebli tzewji biya? 💍🥺</h1>

  <div class="buttons">
    <button class="btn" id="yes">AH 😍</button>
    <button class="btn" id="no">LA 😏</button>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const text = document.getElementById("text");
    const gif = document.getElementById("loveGif");
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    let noScale = 1;
    let yesScale = 1;

    let messages = [
      "Wesh met2akda? 😏",
      "Wesh bsa7? 😳",
      "Fakri 3awdi 😂",
      "Zidi fakri 😭",
      "Rah ghalta 😭💔"
    ];
    let index = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // 🔴 LA CLICK
    noBtn.onclick = () => {
      // shrink LA
      noScale -= 0.15;

      if (noScale <= 0) {
        noBtn.style.opacity = "0";
        noBtn.style.transform = "scale(0)";
        setTimeout(() => noBtn.style.display = "none", 300);
      } else {
        noBtn.style.transform = "scale(" + noScale + ")";
      }

      // grow AH
      yesScale += 0.2;
      yesBtn.style.transform = "scale(" + yesScale + ")";

      // change text
      text.innerText = messages[index % messages.length];
      index++;

      // hide gif if visible
      gif.style.display = "none";
    };

    // 🟢 AH CLICK
    yesBtn.onclick = () => {
      yesScale += 0.3;
      yesBtn.style.transform = "scale(" + yesScale + ")";

      text.innerText = "🥳 Mabrouuuuk!! 🥳";

      gif.style.display = "block";

      startCelebration();
    };

    // ❤️ HEART DRAW
    function drawHeart(x, y, size, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x, y - size/2, x - size, y - size/2, x - size, y);
      ctx.bezierCurveTo(x - size, y + size/2, x, y + size, x, y + size*1.2);
      ctx.bezierCurveTo(x, y + size, x + size, y + size/2, x + size, y);
      ctx.bezierCurveTo(x + size, y - size/2, x, y - size/2, x, y);
      ctx.fillStyle = "#ff2d55";
      ctx.fill();
      ctx.restore();
    }

    // 🎉 CONFETTI + HEARTS
    function startCelebration() {
      let confetti = [];
      let hearts = [];

      for (let i = 0; i < 150; i++) {
        confetti.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 6 + 3,
          speedY: Math.random() * 3 + 2,
          color: "hsl(" + Math.random()*360 + ",100%,50%)"
        });
      }

      for (let i = 0; i < 40; i++) {
        hearts.push({
          x: canvas.width/2,
          y: canvas.height/2,
          size: Math.random()*10 + 8,
          vx: (Math.random()-0.5)*6,
          vy: -(Math.random()*4 + 2),
          alpha: 1
        });
      }

      function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        confetti.forEach(p=>{
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x,p.y,p.size,p.size);
          p.y += p.speedY;
          if(p.y > canvas.height) p.y = 0;
        });

        hearts.forEach(h=>{
          drawHeart(h.x,h.y,h.size,h.alpha);
          h.x += h.vx;
          h.y += h.vy;
          h.alpha -= 0.02;
        });

        hearts = hearts.filter(h=>h.alpha>0);

        if (hearts.length > 0) {
          requestAnimationFrame(animate);
        }
      }

      animate();
    }
  </script>

</body>
</html>
