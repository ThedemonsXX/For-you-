<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Heart - Shifted</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&family=Plus+Jakarta+Sans:wght=400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #060105;
            --bg-glow: #1a0412;
            --primary-love: #ff2a5f;
            --primary-glow: rgba(255, 42, 95, 0.8);
            --text-light: #fff0f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-dark) 100%);
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Interactive Canvas Background */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Display Arena - Lifted slightly with a bottom margin */
        #heart-viewport {
            position: relative;
            width: 100vmin; 
            height: 100vmin;
            max-width: 680px;
            max-height: 680px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            margin-bottom: 6vh; /* Shifts the heart up a little bit */
        }

        /* Connecting Laser/Glow Lines */
        #svg-network {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart-line {
            stroke: var(--primary-love);
            stroke-width: 1.5;
            stroke-linecap: round;
            opacity: 0.45;
            filter: drop-shadow(0 0 4px var(--primary-love));
            stroke-dasharray: 10 5;
            animation: energyFlow 1.5s infinite linear;
        }

        @keyframes energyFlow {
            to { stroke-dashoffset: -15; }
        }

        /* Ambient Pulse Waves behind Her Name */
        .pulse-wave {
            position: absolute;
            width: clamp(140px, 30vmin, 220px);
            height: clamp(65px, 13vmin, 90px);
            border-radius: 60px;
            background: transparent;
            border: 2px solid var(--primary-love);
            box-shadow: 0 0 20px var(--primary-glow);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            animation: ripple 3s infinite cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .pulse-wave:nth-child(2) { animation-delay: 1s; }
        .pulse-wave:nth-child(3) { animation-delay: 2s; }

        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 0.5; filter: blur(0px); }
            100% { transform: scale(1.6); opacity: 0; filter: blur(4px); }
        }

        /* Center Core Node */
        .center-core {
            position: absolute;
            z-index: 10;
            background: linear-gradient(135deg, #ff2a5f 0%, #ff5e62 100%);
            padding: clamp(12px, 2.5vmin, 22px) clamp(25px, 5vmin, 45px);
            border-radius: 50px;
            box-shadow: 0 0 35px var(--primary-glow), 
                        inset 0 4px 12px rgba(255, 255, 255, 0.4);
            animation: structuralBeat 1.4s infinite alternate cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: center;
        }

        /* THE TARGET LABEL FOR HER NAME */
        .her-name-label {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.8rem, 5vmin, 2.8rem);
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        @keyframes structuralBeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); box-shadow: 0 0 45px rgba(255, 42, 95, 1); }
        }

        /* Premium Glassmorphism Emotion Cards */
        .emotion-card {
            position: absolute;
            z-index: 5;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            padding: clamp(6px, 1.5vmin, 12px) clamp(12px, 2.8vmin, 22px);
            border-radius: 20px;
            font-size: clamp(0.7rem, 1.8vmin, 0.95rem);
            font-weight: 600;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transform: translate(-50%, -50%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: floatingFloat 5s infinite alternate ease-in-out;
            white-space: nowrap;
        }

        .emotion-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(to bottom, rgba(255,42,95,0.4), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .emotion-card:hover {
            background: rgba(255, 42, 95, 0.18);
            border-color: rgba(255, 42, 95, 0.5);
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.4);
            color: #ffffff;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .emotion-card:nth-child(even) { animation-duration: 4s; animation-delay: 0.5s; }
        .emotion-card:nth-child(3n) { animation-duration: 6s; animation-delay: 0.2s; }

        @keyframes floatingFloat {
            0% { transform: translate(-50%, -50%) translateY(0px); }
            100% { transform: translate(-50%, -50%) translateY(-6px); }
        }

        @media (max-width: 500px) {
            .emotion-card.edge-left { left: 10% !important; }
            .emotion-card.edge-right { left: 90% !important; }
            .emotion-card.top-left { left: 28% !important; top: 20% !important; }
            .emotion-card.top-right { left: 72% !important; top: 20% !important; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div id="heart-viewport">
        <div class="pulse-wave"></div>
        <div class="pulse-wave"></div>
        <div class="pulse-wave"></div>

        <svg id="svg-network"></svg>

        <div class="center-core" id="anchor-core">
            <p class="her-name-label">Nisrine</p>
        </div>

        <div class="emotion-card" style="left: 50%; top: 27%;">Safe</div>
        <div class="emotion-card top-left" style="left: 32%; top: 18%;">Comfortable</div>
        <div class="emotion-card" style="left: 16%; top: 32%;">Adored</div>
        <div class="emotion-card edge-left" style="left: 13%; top: 52%;">Peaceful</div>
        <div class="emotion-card" style="left: 26%; top: 74%;">Inspired</div>
        
        <div class="emotion-card" style="left: 50%; top: 92%;">Complete</div>
        
        <div class="emotion-card" style="left: 74%; top: 74%;">Cherished</div>
        <div class="emotion-card edge-right" style="left: 87%; top: 52%;">Understood</div>
        <div class="emotion-card" style="left: 84%; top: 32%;">Warmth</div>
        <div class="emotion-card top-right" style="left: 68%; top: 18%;">Protected</div>
    </div>

    <script>
        const viewport = document.getElementById('heart-viewport');
        const svg = document.getElementById('svg-network');
        const anchorCore = document.getElementById('anchor-core');
        const cards = document.querySelectorAll('.emotion-card');
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        function updateNetworkLines() {
            svg.innerHTML = '';
            const viewRect = viewport.getBoundingClientRect();
            const coreRect = anchorCore.getBoundingClientRect();
            
            const cx = (coreRect.left + coreRect.width / 2) - viewRect.left;
            const cy = (coreRect.top + coreRect.height / 2) - viewRect.top;

            cards.forEach(card => {
                const cardRect = card.getBoundingClientRect();
                const nx = (cardRect.left + cardRect.width / 2) - viewRect.left;
                const ny = (cardRect.top + cardRect.height / 2) - viewRect.top;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cx);
                line.setAttribute('y1', cy);
                line.setAttribute('x2', nx);
                line.setAttribute('y2', ny);
                line.setAttribute('class', 'heart-line');
                
                svg.appendChild(line);
            });
        }

        let particles = [];
        let particleCount = window.innerWidth < 600 ? 35 : 65;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height + canvas.height;
                this.size = Math.random() * 3 + 0.5;
                this.speedY = Math.random() * -1.0 - 0.3;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.alpha = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ff2a5f';
                ctx.fillStyle = 'rgba(255, 120, 160, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                let p = new Particle();
                p.y = Math.random() * canvas.height;
                particles.push(p);
            }
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            updateNetworkLines();
            requestAnimationFrame(renderLoop);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            particleCount = window.innerWidth < 600 ? 35 : 65;
            updateNetworkLines();
        });

        resizeCanvas();
        initParticles();
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
